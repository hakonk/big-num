name: BoringSSL upstream watch

# Monthly forcing function for re-vendoring: fails when upstream commits have
# touched any file we vendor since the pinned revision. Intentionally noisy —
# vendored crypto must not go stale silently. Re-vendoring with
# scripts/vendor-boringssl-2.sh resets it. The watched set is derived from
# PROVENANCE.txt (upstream path column), so it tracks the vendored tree
# exactly and cannot drift when the allowlist changes.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Check for upstream changes to vendored paths
      run: |
        git clone --filter=blob:none https://boringssl.googlesource.com/boringssl /tmp/boringssl
        PROV=Sources/CBigNumBoringSSL/PROVENANCE.txt
        PINNED=$(awk '/^# upstream_revision/ {print $NF}' "${PROV}")
        echo "Pinned revision: ${PINNED}"
        # Watch exactly the upstream files we vendor (column 2; '-' = generated).
        readarray -t PATHS < <(grep -v '^#' "${PROV}" | cut -f2 | grep -v '^-$' | LC_ALL=C sort -u)
        echo "Watching ${#PATHS[@]} upstream paths"
        cd /tmp/boringssl
        N=$(git rev-list --count "${PINNED}..origin/main" -- "${PATHS[@]}")
        if [ "${N}" -gt 0 ]; then
          echo "::error::${N} upstream commit(s) touch vendored paths since ${PINNED} — re-vendor with scripts/vendor-boringssl-2.sh"
          git log --oneline "${PINNED}..origin/main" -- "${PATHS[@]}" | head -30
          exit 1
        fi
        echo "Vendored tree is current with upstream main for all vendored paths."
