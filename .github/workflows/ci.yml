name: Swift

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  macOS:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Build
      run: swift build
    - name: Run tests
      run: swift test

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag: ['6.1', '6.2']
    container:
      image: swift:${{ matrix.tag }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Test
      run: swift test

  verify-provenance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Clone BoringSSL (blobless)
      run: git clone --filter=blob:none https://boringssl.googlesource.com/boringssl /tmp/boringssl
    - name: Verify vendored tree against upstream
      run: scripts/verify-provenance.sh -p /tmp/boringssl
