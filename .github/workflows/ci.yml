name: Swift

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  macOS:
    strategy:
      fail-fast: false
      matrix:
        backend: [rustcrypto, boringssl]
    runs-on: macOS-latest
    env:
      BIGNUM_BACKEND: ${{ matrix.backend }}
      BIGNUM_BUILD_FROM_SOURCE: "1"
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Install Rust (pinned by rust/rust-toolchain.toml)
      if: matrix.backend == 'rustcrypto'
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain none --profile minimal
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: Build Rust FFI library
      if: matrix.backend == 'rustcrypto'
      run: ./scripts/build-rust.sh
    - name: Build
      run: swift build
    - name: Run tests
      run: swift test

  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        tag: ['6.1', '6.2']
        backend: [rustcrypto, boringssl]
    runs-on: ${{ matrix.runner }}
    container:
      image: swift:${{ matrix.tag }}
    env:
      BIGNUM_BACKEND: ${{ matrix.backend }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Install Rust (pinned by rust/rust-toolchain.toml)
      if: matrix.backend == 'rustcrypto'
      run: |
        apt-get -qq update
        apt-get install -y --no-install-recommends curl ca-certificates build-essential
        # Bootstrap rustup; the rust/rust-toolchain.toml file pins the actual
        # rustc version, which rustup downloads on first cargo invocation.
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain none --profile minimal
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: Build Rust FFI library
      if: matrix.backend == 'rustcrypto'
      run: ./scripts/build-rust.sh
    - name: Test
      run: swift test

  windows:
    strategy:
      fail-fast: false
      matrix:
        backend: [rustcrypto, boringssl]
    runs-on: windows-latest
    env:
      BIGNUM_BACKEND: ${{ matrix.backend }}
      BIGNUM_BUILD_FROM_SOURCE: "1"
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Install Swift
      shell: pwsh
      run: |
        # Swift Windows installer URL pattern (see swift.org/install/windows).
        $swiftVersion = 'swift-6.1-release'
        $swiftBuild   = '6.1-RELEASE'
        $url = "https://download.swift.org/$swiftVersion/windows10/swift-$swiftBuild/swift-$swiftBuild-windows10.exe"
        $installer = Join-Path $env:RUNNER_TEMP 'swift-installer.exe'
        Invoke-WebRequest -UseBasicParsing $url -OutFile $installer

        $logPath = Join-Path $env:RUNNER_TEMP 'swift-install.log'
        $proc = Start-Process -FilePath $installer `
          -ArgumentList @('/quiet', '/log', "`"$logPath`"") `
          -Wait -PassThru -Verb RunAs
        if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
          Get-Content $logPath -ErrorAction SilentlyContinue
          throw "Swift installer exited with code $($proc.ExitCode)"
        }

        # The installer sets PATH/SDKROOT/DEVELOPER_DIR etc. in the Machine
        # and User environment scopes; propagate them into the running job's
        # environment so subsequent steps see swift.exe + runtime DLLs.
        foreach ($level in 'Machine','User') {
          [Environment]::GetEnvironmentVariables($level).GetEnumerator() | ForEach-Object {
            if ($_.Name -eq 'Path') {
              $_.Value = ("$env:Path;$($_.Value)" -Split ';' | Select-Object -Unique) -Join ';'
            }
            $_
          } | Set-Content -Path { "Env:$($_.Name)" }
        }
        "$env:Path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8
        Get-ChildItem Env: | ForEach-Object {
          "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
    - name: Install Rust (pinned by rust/rust-toolchain.toml)
      if: matrix.backend == 'rustcrypto'
      shell: pwsh
      run: |
        Invoke-WebRequest -UseBasicParsing https://win.rustup.rs/x86_64 `
          -OutFile $env:RUNNER_TEMP\rustup-init.exe
        & $env:RUNNER_TEMP\rustup-init.exe -y --default-toolchain none --profile minimal
        Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.cargo\bin"
    - name: Build Rust FFI library
      if: matrix.backend == 'rustcrypto'
      shell: pwsh
      run: ./scripts/build-rust.ps1
    - name: Test
      shell: pwsh
      run: swift test
